name: Publish clover CLI

# Builds the native `clover` binary on every supported platform and publishes
# the npm packages assembled by packages/server-rust/scripts/build-npm.mjs.
#
# Versioning belongs to changesets: `pnpm release` bumps the workspace packages
# and syncs `packages/server-rust/package.json` to the same version. This
# workflow only builds and uploads that version, and rejects a tag that does not
# match it:
#
#   git tag clover-cli-v0.1.6 && git push origin clover-cli-v0.1.6
#
# Requires an NPM_TOKEN repository secret with publish rights for the
# @julyware scope.

on:
  push:
    tags:
      - 'clover-cli-v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag'
        required: false
        default: latest
        type: string
      dry_run:
        description: 'Pack without uploading'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-clover-cli
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - id: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - id: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - id: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - id: linux-arm64-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/server-rust/package.json').version")"
          node scripts/sync-cargo-version.mjs --check
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "clover-cli-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/server-rust/package.json ($version)."
            echo "::error::Run 'pnpm release', commit the version bump, then tag clover-cli-v$version."
            exit 1
          fi
          echo "Publishing @julyware/clover-cli@$version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build npm platform package
        run: >-
          node packages/server-rust/scripts/build-npm.mjs
          --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.id }}
          path: packages/server-rust/npm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/download-artifact@v4
        with:
          path: packages/server-rust/npm
          pattern: npm-*
          merge-multiple: true

      - name: Publish npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          args=(--tag "${{ inputs.dist_tag || 'latest' }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          node packages/server-rust/scripts/publish-npm.mjs "${args[@]}"