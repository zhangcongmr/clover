name: Release Desktop

# Builds the Tauri desktop shell on every supported platform and uploads the
# installers to a draft GitHub Release.
#
#   git tag clover-desktop-v1.1.0
#   git push origin clover-desktop-v1.1.0
#
# The tag must match packages/desktop/package.json. The workflow opens a draft
# release so a broken platform can be rebuilt before users see it. Desktop
# releases are independent from the CLI tag (`clover-cli-v*`), although both
# use the same changesets version.
#
# Optional signing secrets (see packages/desktop/README.md):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater)

on:
  push:
    tags:
      - 'clover-desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - id: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - id: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - id: linux-x64-gnu
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tauri v2 needs WebKitGTK 4.1 and the Ayatana appindicator headers on Linux.
      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.id }}

      # The repository does not track pnpm-lock.yaml, so the lockfile has to be
      # resolved here. tauri-action uses the `tauri` script from
      # packages/desktop/package.json (see tauriScript below).
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/desktop/package.json').version")"
          node scripts/sync-cargo-version.mjs --check

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "clover-desktop-v$version" ]]; then
              echo "::error::tag $tag does not match packages/desktop/package.json ($version)."
              echo "::error::Run 'pnpm release', commit the version bump, then tag clover-desktop-v$version."
              exit 1
            fi
          else
            # Manual dispatch: build the current branch as a draft release for
            # the version in packages/desktop/package.json.
            tag="clover-desktop-v$version"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      # GitHub turns an unset secret into an empty environment variable, and
      # tauri-bundler imports APPLE_CERTIFICATE whenever the variable exists.
      # An empty value therefore fails with
      #   SecKeychainItemImport: Unable to decode the provided data.
      # Export the signing variables only when they actually hold a value, so
      # a repository without signing secrets still produces an unsigned app.
      - name: Configure macOS signing
        if: matrix.runner == 'macos-latest'
        shell: bash
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Writes a multi-line-safe value to $GITHUB_ENV.
          export_env() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              return 0
            fi
            {
              echo "${name}<<__GITHUB_ENV_VALUE__"
              printf '%s\n' "$value"
              echo "__GITHUB_ENV_VALUE__"
            } >> "$GITHUB_ENV"
          }

          if [[ -z "${SECRET_APPLE_CERTIFICATE}" ]]; then
            echo "No APPLE_CERTIFICATE secret: building an unsigned app."
            echo "Gatekeeper blocks unsigned apps until the user allows them."
            exit 0
          fi

          export_env APPLE_CERTIFICATE "${SECRET_APPLE_CERTIFICATE}"
          export_env APPLE_CERTIFICATE_PASSWORD "${SECRET_APPLE_CERTIFICATE_PASSWORD}"
          export_env APPLE_SIGNING_IDENTITY "${SECRET_APPLE_SIGNING_IDENTITY}"
          export_env APPLE_ID "${SECRET_APPLE_ID}"
          export_env APPLE_PASSWORD "${SECRET_APPLE_PASSWORD}"
          export_env APPLE_TEAM_ID "${SECRET_APPLE_TEAM_ID}"
          echo "Signing configured with APPLE_SIGNING_IDENTITY=${SECRET_APPLE_SIGNING_IDENTITY:-<auto>}"

      # Only used once tauri-plugin-updater and bundle.createUpdaterArtifacts
      # are enabled. Applies to every platform, so it is separate from the
      # macOS step above.
      - name: Configure updater signing
        shell: bash
        env:
          SECRET_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${SECRET_TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            exit 0
          fi

          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__GITHUB_ENV_VALUE__"
            printf '%s\n' "${SECRET_TAURI_SIGNING_PRIVATE_KEY}"
            echo "__GITHUB_ENV_VALUE__"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__GITHUB_ENV_VALUE__"
            printf '%s\n' "${SECRET_TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
            echo "__GITHUB_ENV_VALUE__"
          } >> "$GITHUB_ENV"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          # The repo has no tracked pnpm lockfile, so the action cannot detect
          # pnpm on its own.
          tauriScript: pnpm tauri
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: 'Clover ${{ steps.release.outputs.version }}'
          releaseBody: |
            Clover desktop installers.

            Download the package for your platform below:
            - Windows: `.msi` or `-setup.exe`
            - macOS: `.dmg` (Apple Silicon / Intel)
            - Linux: `.AppImage`, `.deb` or `.rpm`
          releaseDraft: true
          prerelease: false
          # Flip to true after enabling tauri-plugin-updater.
          includeUpdaterJson: false
          args: ${{ matrix.args }}