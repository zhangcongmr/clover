<ast-modal [title]="'Share on API Community'" [visible]="visible" [modalSize]="'small'" (close)="onClose()">
  <div class="codigma-ast-modal-body">
    <div class="ShareOnMessage">Are you sure to share on API community?</div>
    <div class="ShareOnActions">
      <div class="btn cancel" (click)="onClose()">Cancel</div>
      <div class="btn confirm" (click)="confirmShare()">Share</div>
    </div>
  </div>
</ast-modal>
