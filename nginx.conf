
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location /julyware/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /julyware/index.html;
        }
        location /assistant/ {
            root   html;
            index  index.csr.html index.csr.htm;
			try_files $uri $uri/ /assistant/index.csr.html;
        }

        location /community-widget/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /community-widget/index.html;
        }
        location /home/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /home/index.html;
        }
        location /official-site/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /official-site/index.html;
        }
        location /signin/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /signin/index.html;
        }
        location /forgotpassword/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /forgotpassword/index.html;
        }
        location /resetpassword/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /resetpassword/index.html;
        }
        location /signup/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /signup/index.html;
        }
        location /editor/ {
            root   html;
            index  index.html index.htm;
			try_files $uri $uri/ /editor/index.html;
        }

		# 代理 API 请求到后端（同域，无跨域问题！）
		location /api {
			proxy_pass http://localhost:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
