packages:
  - 'packages/*'

minimumReleaseAgeExcludePrune: true
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'
  - '@openai/codex-darwin-arm64'
  - '@openai/codex-darwin-x64'
  - '@openai/codex-linux-arm64'
  - '@openai/codex-linux-x64'
  - '@openai/codex-win32-arm64'
  - '@openai/codex-win32-x64'
minimumReleaseAgeExclude:
  - '@agentclientprotocol/claude-agent-acp@0.98.0'
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  node-pty: true
  # onnxruntime-node's postinstall only downloads optional CUDA/TensorRT
  # provider libraries on linux/x64. The CPU runtime is bundled with the npm
  # package and @clover/mcp-rag uses executionProviders: ['cpu'], so skip the
  # download (it fails on networks where api.nuget.org redirects, e.g. to
  # nuget.azure.cn, because the installer does not follow HTTP redirects).
  onnxruntime-node: false
