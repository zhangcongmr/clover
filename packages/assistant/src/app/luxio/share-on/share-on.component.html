<ast-modal [title]="'Share on Community'" [visible]="visible" [modalSize]="'small'" (close)="onClose()">
  <div class="codigma-ast-modal-body">
    <div class="ShareOnMessage">
      Are you sure to share on Community?
    </div>
    <div class="ShareOnPermission">
      <label>Permission:</label>
      <select [(ngModel)]="data.permission">
        <option value="read">Read-only (others)</option>
        <option value="readwrite">Read &amp; edit (owner)</option>
      </select>
    </div>
    <div class="ShareOnActions">
      <div class="btn cancel" (click)="onClose()">Cancel</div>
      <div class="btn confirm" (click)="confirmShare()">Share</div>
    </div>
  </div>
</ast-modal>
