<div class="overview-placeholder">
  <div class="overview-items">
    <button type="button" class="overview-item" (click)="close()" title="Open Workspace">
      <span class="overview-item-head">
        <svg class="overview-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="overview-item-label">Session</span>
        <span class="overview-item-badge" [attr.data-status]="overviewStatus().cls">
          <span class="overview-item-dot"></span>{{ overviewStatus().label }}
        </span>
      </span>
      <span class="overview-item-value" [attr.title]="overviewSessionTitle()">{{ overviewSessionTitle() }}</span>
    </button>

    <button type="button" class="overview-item" (click)="close()" title="Open Workspace">
      <span class="overview-item-head">
        <svg class="overview-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <path d="M8 16h.01"></path>
          <path d="M16 16h.01"></path>
        </svg>
        <span class="overview-item-label">Agent</span>
      </span>
      <span class="overview-item-value overview-item-value-row">
        <span class="overview-agent-badge">{{ overviewAgent()?.badge ?? '--' }}</span>
        <span class="overview-item-value-text">{{ overviewAgent()?.name ?? '—' }}</span>
      </span>
    </button>

    <button type="button" class="overview-item" (click)="close()" title="Open Workspace">
      <span class="overview-item-head">
        <svg class="overview-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
        <span class="overview-item-label">Model / Mode</span>
      </span>
      <span class="overview-item-value" [attr.title]="overviewModelLabel()">{{ overviewModelLabel() || '—' }}</span>
      <span class="overview-item-sub">Mode: {{ overviewModeLabel() || '—' }}</span>
    </button>

    <button type="button" class="overview-item" (click)="close()" title="Open Workspace">
      <span class="overview-item-head">
        <svg class="overview-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="overview-item-label">Project</span>
      </span>
      <span class="overview-item-value overview-item-value-row">
        <span class="overview-item-value-text">{{ overviewProject()?.name ?? 'No project' }}</span>
        @if (overviewProject(); as project) {
          <span class="overview-type-tag">{{ project.type }}</span>
        }
      </span>
      <span class="overview-item-sub" [attr.title]="overviewProject()?.path ?? ''">{{ overviewProject()?.path ?? '' }}</span>
    </button>

    <button type="button" class="overview-item" (click)="close()" title="Open Workspace">
      <span class="overview-item-head">
        <svg class="overview-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span class="overview-item-label">Activity</span>
      </span>
      <span class="overview-item-value">{{ overviewMessageCount() }} message{{ overviewMessageCount() === 1 ? '' : 's' }}</span>
      <span class="overview-item-sub">
        @if (overviewProcessing()) {
          Agent is working…
        } @else {
          {{ overviewActivityText() }}
        }
      </span>
    </button>

    <button type="button" class="overview-item" (click)="close()" title="Open Workspace">
      <span class="overview-item-head">
        <svg class="overview-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span class="overview-item-label">Tokens &amp; Plan</span>
      </span>
      <span class="overview-item-value">{{ overviewTokensValue() }}</span>
      <span class="overview-item-sub">{{ overviewTokensSub() }}</span>
    </button>
  </div>
</div>
