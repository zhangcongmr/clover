<div class="detail-header">
  <div class="detail-heading">
    <span class="detail-label" [title]="target().label">{{ target().label }}</span>
    <button
      type="button"
      class="detail-session"
      [title]="'复制 Session ID：' + target().sessionId"
      (click)="copySessionId()">
      {{ target().sessionId }}
    </button>
  </div>
  <button type="button" class="detail-close" title="关闭" (click)="closed.emit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</div>

<div class="detail-meta">
  @if (target().agentId) {
    <span class="detail-chip">Agent {{ target().agentId }}</span>
  }
  @if (target().cwd) {
    <span class="detail-chip" [title]="target().cwd!">{{ target().cwd }}</span>
  }
  @if (loading()) {
    <span class="detail-chip loading">加载中…</span>
  }
</div>

@if (loadError(); as errorMessage) {
  <div class="detail-error">
    <span>{{ errorMessage }}</span>
    <button type="button" class="detail-retry" (click)="retry()">重试</button>
  </div>
}

@if (deferred) {
  <div class="detail-deferred">
    <p>协作轮次进行中，暂不自动加载该会话历史，避免与正在运行的 prompt 冲突。</p>
    <button type="button" class="detail-retry" (click)="retry()">立即加载</button>
  </div>
} @else {
  <div class="detail-body">
    <app-acp-chat [readonly]="true" />
  </div>
}
