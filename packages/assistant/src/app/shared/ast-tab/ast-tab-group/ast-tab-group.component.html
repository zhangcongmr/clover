<div data-layer="tab-header" (mouseenter)="whenMouseEnterTabContainer($event)"
  (mouseleave)="whenMouseLeaveTabContainer($event)">
  @if (topLevelTabs) {
  <ul data-layer="tablist" class="TabsInst" (wheel)="onTabWheel($event)" [style]="ulStyle">
    @for (tab of topLevelTabs; track tab; let tabIndex = $index) {
    <li data-layer="tab" data-tab_type="tab_header" (click)="selectTab($event, tab)" (contextmenu)="showContextMenu($event, tab)" [class]="tab.activeClass"
      [style.min-width]="tab.minWidth">
      <div data-layer="padding_left_space" class="padding_left_space"></div>
      <div class="codigma-project">{{tab['label']()}}</div>
      @if (closable()&&(tab.closable==null||tab.closable==true)) {
        @if(tab['saved']()==false) {
          <div data-svg-wrapper="" data-layer="close-btn" class="CloseBtn tab-close-cnr" (click)="iconCloseClick($event,tab)"
            (mouseenter)="whenMouseEnterTabCloseCnr(tab)" (mouseleave)="whenMouseLeaveTabCloseCnr(tab)">
            <!-- <img
              [attr.src]="(tab.dotOrClose || tab.dotOrClose == null || tab.dotOrClose == undefined) ? 'assets/imgs/red-dot.svg' : 'assets/imgs/close-icon.svg'"> -->
            <svg class="icon" width="18" height="18">
              <use [attr.href]="(tab.dotOrClose || tab.dotOrClose == null || tab.dotOrClose == undefined) ? '#icon-red-dot' : '#icon-close-icon'"></use>
            </svg>
          </div>
        } @else {
          <div data-svg-wrapper="" data-layer="close-btn" class="CloseBtn tab-close" (click)="iconCloseClick($event, tab)">
            <!-- <img src="assets/imgs/close-icon.svg"> -->
            <svg class="icon" width="18" height="18">
              <use href="#icon-close-icon"></use>
            </svg>
          </div>
        }
      }
      <div data-layer="padding_right_space" class="padding_right_space"></div>
    </li>
    }
    <div data-layer="remaining_space" class="RemainingSpace codigma-remaining-space"
      [style.border-bottom]="tabType() && tabType()['type']=='bilateral'?'1px var(--Labels---Vibrant---Controls-Tertiary-√, #D9D9D9) solid':''">
    </div>
  </ul>
  }


  <div data-layer="tab_presentation" [style.width]="'100%'" aria-hidden="true"
    style="position: absolute; height: 3px; left: 0px; bottom: 0px;color: rgb(97, 97, 97);z-index: 10;display: none;">
    <div class="slider" style="position: absolute; top: 0px; left: 0px; height: 3px; transform: translate3d(0px, 0px, 0px);
       contain: strict; color: rgb(97, 97, 97);background-color: rgba(100, 100, 100, 0.4)"
      [style.width]="computedScrollBarLength" [style.left]="scrollBarLeft + 'px'">
    </div>
  </div>
</div>

<div ast-menu [(isOpen)]="isOpen"  [menuInitiator]="menuInitiator"  class="more-btn-dropdown-content codigma-right-menu">
  <div data-layer="closeall" class="codigma-menu-every-item" (click)="closeTabs('close-all')">
    <svg t="1770186219664" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="12615" width="16" height="16"><path d="M450.3 625.5L557.8 733 502 784.8 398.5 677.3 291 784.8 239.2 733l107.5-107.5L239.2 522l51.8-55.8 107.5 107.5L502 466.2l55.8 55.8-107.5 103.5zM287 291H135.7L64 362.7v525.7l71.7 71.7h525.7l71.7-71.7V737.1h151.3l75.7-75.7V139.7L884.4 64H362.7L287 139.7V291z m75.7-151.3h521.7v521.7H733.1V362.7L661.4 291H362.7V139.7z m298.6 748.6H135.7V362.7h525.7v525.7z" p-id="12616"></path></svg>
    <span>Close All</span></div>
  <div data-layer="closeothers" class="codigma-menu-every-item" (click)="closeTabs('close-others')">
    <svg t="1770186174559" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="11634" width="16" height="16"><path d="M512 0a512 512 0 1 1 0 1024A512 512 0 0 1 512 0z m0 76.8a435.2 435.2 0 1 0 0 870.4 435.2 435.2 0 0 0 0-870.4z m243.2 396.8c21.211429 0 38.4 21.211429 38.4 47.542857 0 26.258286-17.188571 47.542857-38.4 47.542857h-486.4c-21.211429 0-38.4-21.284571-38.4-47.542857 0-26.331429 17.188571-47.542857 38.4-47.542857z" p-id="11635"></path></svg>
    <span>Close Others</span></div>
</div>

@if(!tabsOnlyMode()) { <!-- 如果不是只显示tab栏模式，则显示内容区  采用angular非正规做法，angular官方其实不推荐这样使用 参见https://angular.cn/guide/components/content-projection -->
  <ng-content></ng-content>
}
