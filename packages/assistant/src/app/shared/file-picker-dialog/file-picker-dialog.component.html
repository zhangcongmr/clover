<ast-modal [visible]="visible()" [title]="title()" modalSize="large" (close)="cancel()">
  <div class="codigma-ast-modal-body file-picker">
    <div>
<!-- Path navigation bar -->
<div class="path-bar">
  <button (click)="goUp()" class="nav-btn" title="Go up">../</button>
  <input [value]="currentPath()" (keyup.enter)="loadDirectory($any($event.target).value)" class="path-input"
    placeholder="Enter path...">
  <button (click)="refresh()" class="nav-btn" title="Refresh">&#x21bb;</button>
</div>

<!-- File tree -->
<div class="tree-container">
  @if (loading()) {
  <div class="loading">Loading...</div>
  } @else {
  <div ast-tree [data]="treeData()" [fobiddenContextMenu]="true" (nodeClick)="onTreeNodeClick($event)"
    [folderBeforeToggle]="expandFolderFn"
    class="custom-scroll file-tree"></div>
  }
</div>

<!-- Footer buttons -->
<div class="dialog-footer">
  <span class="selected-info">
    @if (selectedNode()) {
    Selected: {{ getFullPath(selectedNode()!) }}
    }
  </span>
  <div class="footer-buttons">
    <button (click)="cancel()" class="btn-cancel">Cancel</button>
    <button (click)="confirm()" class="btn-confirm" [disabled]="!selectedNode()">Open</button>
  </div>
</div>
    </div>
   
  </div>
</ast-modal>
