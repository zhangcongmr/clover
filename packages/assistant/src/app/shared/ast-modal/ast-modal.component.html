@if (visible()) {
<div #modal [attr.id]="elementId" class="ast-modal-container">
  <div data-layer="ast-modal" class="AstModal codigma-ast-modal">
    <div data-layer="ast-modal-header" class="AstModalHeader codigma-ast-modal-header" (mousedown)="startDrag($event)">
      <div data-layer="title" class="Title codigma-title">{{title()}}</div>
      <div data-svg-wrapper="" data-layer="close-btn" class="close-button" (click)="closeDlg()"
        (mousedown)="$event.stopPropagation()">
        <svg class="icon" width="18" height="18" style="margin: auto;">
          <use href="#icon-close-icon"></use>
        </svg>
      </div>
    </div>
    <ng-content select=".codigma-ast-modal-body"></ng-content>
    <ng-content select=".codigma-describe-btns"></ng-content>
  </div>
</div>
}
