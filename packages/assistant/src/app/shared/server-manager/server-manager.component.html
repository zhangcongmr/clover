<ast-modal [title]="'Add server'" [visible]="addServerVisible" (close)="close()">
  <div class="ast-modal-body">
    <form class="flat-form">
      <div class="field">
        <label for="Scheme">Scheme</label>
        <ast-select [data]="dataList" [inputValue]="data.scheme"></ast-select>
      </div>

      <div class="field">
        <label for="IP">IP</label>
        <input id="IP" type="text" placeholder="127.0.0.1" name="IP" [(ngModel)]="data.ip" autocomplete="off" />
      </div>

      <div class="field">
        <label for="Port">Port</label>
        <input id="Port" type="text" placeholder="4200" name="Port" [(ngModel)]="data.port" autocomplete="off" />
      </div>
    </form>
  </div>
  <div class="ast-describe-btns">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="confirm()">Confirm</button>
  </div>
</ast-modal>

<ast-modal [title]="'Delete server'" [visible]="deleteServerVisible" (visibleChange)="visibleChangeDeleteDlg($event)" (close)="close()">
  <div class="ast-modal-body">
    <div class="ast-server-manager-delete-body">
      <ul class="ast-server-manager-list">
        @for (server of servers; track server) {
          <li class="ast-server-manager-row">
            <span class="ast-server-manager-name">{{ server.text }}</span>
            <button type="button" class="btn btn-ghost btn-danger" (click)="deleteAction(server)">Delete</button>
          </li>
        } @empty {
          <li class="ast-server-manager-empty">No servers.</li>
        }
      </ul>
    </div>
  </div>
  <div class="ast-describe-btns">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </div>
</ast-modal>
