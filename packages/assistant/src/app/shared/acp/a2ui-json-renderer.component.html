<div class="a2ui-json-renderer" #previewRoot>
  @if (surfaces().length > 0) {
    <div class="a2ui-surfaces-container" #surfacesContainer>
      @for (surfaceId of surfaces(); track surfaceId) {
        <a2ui-v09-surface [surfaceId]="surfaceId" />
      }
    </div>
  }
  @if (previewPalette()) {
    <div class="a2ui-preview-row">
      <app-theme-preview-svg variant="welcome" class="a2ui-preview-thumb" (click)="zoomedPreview.set('welcome')" />
      <app-theme-preview-svg variant="chat" class="a2ui-preview-thumb" (click)="zoomedPreview.set('chat')" />
    </div>
  }
  @if (remainingContent()) {
    <div class="message-text" [innerHTML]="remainingContent() | formatMessage"></div>
  }
</div>

<!-- Rendered via CDK Overlay (TemplatePortal) so it escapes the virtual
     scroll wrapper, whose inline transform would otherwise become the
     containing block for this fixed-position lightbox. -->
<ng-template #zoomOverlay>
  @if (zoomedPreview(); as variant) {
    <div class="a2ui-screenshot-overlay" (click)="zoomedPreview.set(null)">
      <button type="button" class="a2ui-preview-nav a2ui-preview-nav--prev" aria-label="Previous preview" (click)="stepPreview(-1, $event)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="a2ui-preview-stage">
        <app-theme-preview-svg [variant]="variant" [palette]="previewPalette()" class="a2ui-preview-zoom" />
      </div>
      <button type="button" class="a2ui-preview-nav a2ui-preview-nav--next" aria-label="Next preview" (click)="stepPreview(1, $event)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
  }
</ng-template>
