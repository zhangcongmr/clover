<div data-layer="collection-headers" class="CollectionHeaders ast-collection-headers">
  <div data-layer="ProjectName-cnr" class="ProjectnameCnr ast-projectname-cnr">
    <div data-layer="ProjectName" class="Projectname ast-projectname">Environment:</div>
  </div>
  <div data-layer="quickly-bars" class="QuicklyBars ast-quickly-bars">
    <!-- 这个 div 添加了 tabindex="0"，可以触发 blur -->
    <div data-svg-wrapper="" data-layer="more-btn" tabindex="0" (click)="clickMoreBtn($event)"
      (blur)="blurMoreBtn($event)" class="btn-svg MoreBtn">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M3.75 8.75C3.0625 8.75 2.5 9.3125 2.5 10C2.5 10.6875 3.0625 11.25 3.75 11.25C4.4375 11.25 5 10.6875 5 10C5 9.3125 4.4375 8.75 3.75 8.75ZM16.25 8.75C15.5625 8.75 15 9.3125 15 10C15 10.6875 15.5625 11.25 16.25 11.25C16.9375 11.25 17.5 10.6875 17.5 10C17.5 9.3125 16.9375 8.75 16.25 8.75ZM10 8.75C9.3125 8.75 8.75 9.3125 8.75 10C8.75 10.6875 9.3125 11.25 10 11.25C10.6875 11.25 11.25 10.6875 11.25 10C11.25 9.3125 10.6875 8.75 10 8.75Z"
          fill="black" />
      </svg>
    </div>
    <div ast-menu [(isOpen)]="isOpen" [menuInitiator]="menuInitiator" (mouseentermenu)="mouseentermenu($event)" (mouseleavemenu)="mouseleavemenu($event)" 
        class="more-btn-dropdown-content ast-right-menu">
      <div data-layer="Add Server" class="AddServer ast-menu-every-item" (click)="addServerDlg()"><span>Add
          Server</span></div>
      <div data-layer="Delete Sever" class="DeleteSever ast-menu-every-item" (click)="deleteServerDlg()">
        <span>Delete Sever</span>
      </div>
      <div data-layer="Add Service" class="AddService ast-menu-every-item" (click)="addServiceDlg()"><span>Add
          Service</span></div>
      <div data-layer="Delete Service" class="DeleteService ast-menu-every-item" (click)="deleteServiceDlg()">
        <span>Delete Service</span>
      </div>
      <div data-layer="Reset Service" class="ResetService ast-menu-every-item" (click)="resetServiceDlg()">
        <span>Reset Service</span>
      </div>
      <div data-layer="Exit" class="Exit ast-menu-every-item" (click)="clearAuthorize(currentServer)">
        <span>Exit</span>
      </div>
    </div>
  </div>
</div>

<div ast-tree [data]="serverList" [isSearch]="true" (nodeClick)="listClick($event)" [fobiddenContextMenu]="true" class="ast-server-tree"></div>

@if (currentServer && currentServer.data != null && shouldAuthorize) {
<div id="aside_basic_info" class="ast-server-auth-panel">
  <form class="example-form ast-server-auth-form">
    <label>Login</label>
    <input placeholder="username" name="username"
      class="ast-server-auth-input"
      [(ngModel)]="currentServer.data.userName" autocomplete="off">
    <input placeholder="password" name="password" type="password"
      class="ast-server-auth-input"
      [(ngModel)]="currentServer.data.passwd" autocomplete="off">
    <div class="ast-server-auth-actions">
      <button mat-button color="primary" id="confirm_authorize_id" name="confirm_authorize_id"
        class="ast-server-auth-btn"
        (click)="confirmAuthorize(currentServer)">{{authorizeBtnLabel}}</button>
      <br>
    </div>
  </form>
</div>
}

<app-authorize />
<app-server-manager />
<app-service-manager />
