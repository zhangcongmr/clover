# ==========================================
# 经测试此location可以匹配以下几种：
# https://ip:port/terminals?cols=80&rows=24&name={容器名}&pixelWidth=560&pixelHeight=346&cwd=%2Fmnt%2Fstorage%2F
# wss://ip:port/terminals/962?name={容器名}
# https://ip:port/terminals/962/size?cols=210&rows=11&pixelWidth=1470&pixelHeight=158&name={容器名}
#
# name={容器名}参数的位置可以不固定
# ==========================================
location /terminals {
    if ($target_container = "") {
        return 400 "Missing 'name' parameter";
    }
    set $backend "$target_container:3000";
    proxy_pass https://$backend;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_verify off;          # 跳过自签名证书验证
    proxy_buffering off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

location /user {
    proxy_pass https://localhost:8980;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/cmn {
    proxy_pass https://host.containers.internal:3015;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 错误页面（可选，也可放这里）
error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root html;
}