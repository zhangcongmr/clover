# SPA 应用路由（支持前端 History 模式）
location / {
    root   html/official-site;
	index index.html;
    try_files $uri $uri/ /index.html;
}
location /julyware {
    root   html;
    try_files $uri $uri/ /julyware/index.html;
}

# SSR Assistant App (proxy to Node.js on port 4200)
location /assistant/ {
    rewrite ^/assistant(/.*)?$ $1 break;
    proxy_pass https://localhost:4200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_verify off;
    proxy_buffering off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

# 处理 /assistant 无尾斜杠的情况
location = /assistant {
    return 301 /assistant/;
}

# SSR Assistant App 的 API（与 /assistant/ 同一后端）
location /api/local {
    proxy_pass https://localhost:4200;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location  ~ ^/ws/(terminal|file-watch)  {
    proxy_pass https://localhost:4200;
	# 必需的 WebSocket 代理头设置
	# 将原始 Host 头传递给后端
	proxy_http_version 1.1;
	# 传递 Upgrade 和 Connection 头，这是 WebSocket 握手的关键
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	# 传递客户端的真实IP地址
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# 关闭缓冲以实现实时数据传输
	proxy_buffering off;

	# 可选：设置超时时间
	proxy_read_timeout 86400; # 根据需要调整
	proxy_send_timeout 86400;
}

