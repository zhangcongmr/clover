
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # 设置客户端请求体最大为100MB
    client_max_body_size 20M;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # ================= 新增部分 =================
    # 定义一个变量 $target_container
    # 从 $args (URL参数) 中通过正则提取 name= 后面的值
    # 假设你的 URL 是 /terminals?name=container-a&other=xyz
    # 请确保参数名是 "name"，如果不是，请修改下面的 "name"
    map $args $target_container {
        default "";
        # 正则解释：.*name= 匹配任意字符加name=，然后捕获 ([^&]+) 直到遇到下一个&或结尾
        "~.*name=(?<container>[^&]+)" $container;
    }
    # ===========================================

    server {
        listen       80;
        server_name  localhost;
        # rewrite ^(.*)$ https://$host$1 permanent;
        return 301 https://$host$request_uri;

        # 解析 LXD 容器名的 DNS 服务器
        resolver  10.89.0.1 valid=30s;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        # 包含共享的 location 配置（虽然会被重定向，但保留以防调试）
        include shared-locations.conf;

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    
    server {
       listen       443 ssl;
       server_name  localhost;

       ssl_certificate      cert.pem;
       ssl_certificate_key  cert.key;

       ssl_session_cache    shared:SSL:1m;
       ssl_session_timeout  5m;

       ssl_ciphers  HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers  on;

        # 解析 LXD 容器名的 DNS 服务器
        resolver  10.89.0.1 valid=30s;

       # 👇 关键：包含所有 SPA 和 API 路由
       include shared-locations.conf;
    }

}
